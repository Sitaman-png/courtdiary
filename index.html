<script type="module">

import { initializeApp }
    from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";

import {
    getFirestore,
    collection,
    addDoc,
    setDoc,
    doc,
    deleteDoc,
    onSnapshot,
    query,
    orderBy
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";

import {
    getAuth,
    signInAnonymously,
    onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";


/* ============================================================
   FIREBASE CONFIGURATION
   REPLACE THESE VALUES WITH YOUR FIREBASE PROJECT DETAILS
============================================================ */

const firebaseConfig = {

    apiKey: "YOUR_API_KEY",

    authDomain:
        "YOUR_PROJECT.firebaseapp.com",

    projectId:
        "YOUR_PROJECT_ID",

    storageBucket:
        "YOUR_PROJECT.firebasestorage.app",

    messagingSenderId:
        "YOUR_MESSAGING_SENDER_ID",

    appId:
        "YOUR_APP_ID"
};


/* ============================================================
   START FIREBASE
============================================================ */

const app =
    initializeApp(firebaseConfig);

const db =
    getFirestore(app);

const auth =
    getAuth(app);


/* ============================================================
   SHARED COURT DIARY
============================================================ */

let matters = [];

let stations = [
    "Garsen",
    "Kiambu",
    "Kilifi",
    "Kwale",
    "Machakos",
    "Makueni",
    "Malindi",
    "Mariakani",
    "Milimani",
    "Mombasa",
    "Mpeketoni",
    "Msambweni",
    "Voi"
].sort();


/* ============================================================
   USER LOGIN
============================================================ */

signInAnonymously(auth)
    .catch(error => {

        console.error(
            "Authentication error:",
            error
        );

        alert(
            "Could not connect to the shared court diary."
        );
    });


/* ============================================================
   REAL-TIME MATTER LISTENER
============================================================ */

/*
   IMPORTANT:

   This replaces:

       localStorage.getItem("courtDiaryMatters")

   Every computer connected to the website listens to
   this same Firestore collection.

   When one user adds or changes a matter,
   every connected computer receives the change.
*/

onAuthStateChanged(auth, user => {

    if (!user) return;

    const mattersRef =
        collection(db, "courtDiaryMatters");

    const diaryQuery =
        query(
            mattersRef,
            orderBy("upcomingDate", "asc")
        );

    onSnapshot(
        diaryQuery,

        snapshot => {

            matters = [];

            snapshot.forEach(documentSnapshot => {

                matters.push({

                    id: documentSnapshot.id,

                    ...documentSnapshot.data()

                });

            });

            /*
              Your existing display functions can now
              display the shared matters.
            */

            renderCurrentSection();

            if (
                typeof renderCalendar === "function" &&
                selectedSection === "calendar"
            ) {
                renderCalendar();
            }

            /*
              If somebody else edits a matter while
              you have it open, refresh the case view.
            */

            if (
                openedMatterId &&
                matters.some(
                    m => m.id === openedMatterId
                )
            ) {

                if (
                    document
                        .getElementById("caseView")
                        .classList.contains("show")
                ) {
                    renderCase();
                }
            }

        },

        error => {

            console.error(
                "Firestore listener error:",
                error
            );

            alert(
                "The shared diary could not be synchronised."
            );
        }
    );
});


/* ============================================================
   ADD MATTER TO SHARED DATABASE
============================================================ */

async function saveMatterToCloud(matter) {

    try {

        /*
          Firestore creates the permanent record.
        */

        const matterRef =
            await addDoc(
                collection(
                    db,
                    "courtDiaryMatters"
                ),
                matter
            );

        console.log(
            "Matter saved:",
            matterRef.id
        );

        return matterRef.id;

    } catch (error) {

        console.error(
            "Could not save matter:",
            error
        );

        alert(
            "The matter could not be saved to the shared diary."
        );

        throw error;
    }
}


/* ============================================================
   UPDATE MATTER
============================================================ */

async function updateMatterInCloud(
    matterId,
    changes
) {

    try {

        await setDoc(

            doc(
                db,
                "courtDiaryMatters",
                matterId
            ),

            changes,

            {
                merge: true
            }
        );

    } catch (error) {

        console.error(
            "Could not update matter:",
            error
        );

        alert(
            "The matter could not be updated."
        );
    }
}


/* ============================================================
   DELETE MATTER
============================================================ */

async function permanentlyDeleteMatter(
    matterId
) {

    try {

        await deleteDoc(

            doc(
                db,
                "courtDiaryMatters",
                matterId
            )
        );

    } catch (error) {

        console.error(
            "Could not delete matter:",
            error
        );

        alert(
            "The matter could not be deleted."
        );
    }
}


/* ============================================================
   EXAMPLE: ADDING A NEW MATTER
============================================================ */

async function addNewMatterExample() {

    const matter = {

        station: "Malindi",

        courtType:
            "Magistrates Court",

        caseNumber:
            "CMCC E001 of 2026",

        client:
            "Example Client",

        courtNumber:
            "Court 4",

        upcomingDate:
            "2026-10-05",

        purpose:
            "Hearing",

        purposeKey:
            "hearing",

        handler:
            "Sitaman",

        notes:
            "",

        status:
            "active",

        history:
            [],

        createdAt:
            new Date().toISOString()

    };

    await saveMatterToCloud(matter);
}


/* ============================================================
   END FIREBASE CODE
============================================================ */

</script>

<script>

/* ============================================================
   COURT DIARY DATA
============================================================ */

const SPECIAL_COURTS = [
    "Garsen",
    "Kiambu",
    "Machakos",
    "Makueni",
    "Malindi",
    "Milimani",
    "Mombasa",
    "Voi",
    "Kwale"
];

const DEFAULT_STATIONS = [
    "Garsen",
    "Kiambu",
    "Kilifi",
    "Kwale",
    "Machakos",
    "Makueni",
    "Malindi",
    "Mariakani",
    "Milimani",
    "Mombasa",
    "Mpeketoni",
    "Msambweni",
    "Voi"
];

let stations = JSON.parse(
    localStorage.getItem("courtDiaryStations")
) || DEFAULT_STATIONS;

stations = [...new Set(stations)].sort((a,b) =>
    a.localeCompare(b)
);

let matters = JSON.parse(
    localStorage.getItem("courtDiaryMatters")
) || [];

let selectedStation = "ALL";
let selectedSection = "all";
let editingId = null;
let openedMatterId = null;

let calendarDate = new Date();
let selectedCalendarDate = null;

/* ============================================================
   STORAGE
============================================================ */

function saveData() {
    localStorage.setItem(
        "courtDiaryStations",
        JSON.stringify(stations)
    );

    localStorage.setItem(
        "courtDiaryMatters",
        JSON.stringify(matters)
    );
}

/* ============================================================
   DATE HELPERS
============================================================ */

function formatDate(dateString) {
    if (!dateString) return "—";

    const d = new Date(dateString + "T00:00:00");

    return d.toLocaleDateString("en-GB", {
        day: "2-digit",
        month: "short",
        year: "numeric"
    });
}

function todayISO() {
    const d = new Date();

    const month = String(d.getMonth() + 1).padStart(2,"0");
    const day = String(d.getDate()).padStart(2,"0");

    return `${d.getFullYear()}-${month}-${day}`;
}

function isPast(date) {
    return date < todayISO();
}

function renderStations() {

    bar.innerHTML = "";

    all.className =

    };

    bar.appendChild(all);

    stations.forEach(station => {

        btn.className =

        btn.textContent = station;

        btn.onclick = () => {
            selectedStation = station;
            renderStations();
            renderCurrentSection();
        };

    add.className = "station-tab add-station";

    bar.appendChild(add);

function addStation() {

    const name = prompt("Enter the new court station:");

    if (!name) return;

    const clean = name.trim();

    if (!clean) return;

    if (stations.some(s =>
        s.toLowerCase() === clean.toLowerCase()
    )) {
        alert("That station already exists.");
        return;
    }

    stations.push(clean);

    stations.sort((a,b) =>
        a.localeCompare(b)
    );

    saveData();
    renderStations();
    populateStationSelect();
}

/* ============================================================

============================================================ */

function getCourtTypes(station) {

    if (SPECIAL_COURTS.includes(station)) {
        return [
            "High Court",
            "Magistrates Court"
        ];
    }

    return ["Magistrates Court"];
}

function populateStationSelect() {

    const select = document.getElementById("station");

    select.innerHTML = "";

    stations.forEach(station => {

        const option =
            document.createElement("option");

        option.value = station;
        option.textContent = station;

        select.appendChild(option);
    });

    updateCourtTypes();
}

function updateCourtTypes() {

    const station =
        document.getElementById("station").value;

    const select =
        document.getElementById("courtType");

    select.innerHTML = "";

    getCourtTypes(station).forEach(type => {

        const option =
            document.createElement("option");

        option.value = type;
        option.textContent = type;

        select.appendChild(option);
    });
}

/* ============================================================
   FILTERING
============================================================ */

function getFilteredMatters() {

    let result = [...matters];

    if (selectedStation !== "ALL") {
        result = result.filter(m =>
            m.station === selectedStation
        );
    }

    if (selectedSection === "closed") {

        result = result.filter(m =>
            m.status === "closed"
        );

    } else {

        result = result.filter(m =>
            m.status !== "closed"
        );

        if (selectedSection !== "all" &&
            selectedSection !== "search") {

            result = result.filter(m =>
                m.purposeKey === selectedSection
            );
        }
    }

    const search =
        document.getElementById("searchInput")
            .value.trim().toLowerCase();

    if (search) {

        result = result.filter(m => {

            return [
                m.station,
                m.caseNumber,
                m.client,
                m.purpose,
                m.courtType,
                m.courtNumber,
                m.handler
            ].join(" ")
             .toLowerCase()
             .includes(search);

        });
    }

    result.sort((a,b) =>
        (a.upcomingDate || "")
        .localeCompare(b.upcomingDate || "")
    );

    return result;
}

function renderMatterList() {

    const container =

    if (!data.length) {

        container.innerHTML =

    }

    const groups = {};

    data.forEach(m => {

        }

    });

============================================================ */

function openOutcomeModal(matter) {

    document.getElementById("outcomeForm")
        .reset();

    document.getElementById("outcomeModal")
        .classList.add("show");
}

document.getElementById("cancelOutcome")
    .onclick = () => {

        document.getElementById("outcomeModal")
            .classList.remove("show");
    };

document.getElementById("outcomeForm")
    .addEventListener("submit", event => {

        event.preventDefault();

        const matter =
            matters.find(m =>
                m.id === openedMatterId
            );

        if (!matter) return;

        /*
          Preserve the current/upcoming entry
          permanently in history.
        */

        matter.history =
            matter.history || [];

        matter.history.push({

            date: matter.upcomingDate,

            purpose: matter.purpose,

            courtType: matter.courtType,

            courtNumber: matter.courtNumber,

            outcome:
                document.getElementById("outcome")
                    .value.trim(),

            nextDate:
                document.getElementById("nextDate")
                    .value,

            nextPurpose:
                document.getElementById("nextPurpose")
                    .value,

            nextHandler:
                document.getElementById("nextHandler")
                    .value.trim(),

            notes:
                document.getElementById("outcomeNotes")
                    .value.trim()
        });

        const nextDate =
            document.getElementById("nextDate").value;

        if (nextDate) {

            /*
              RETURN MATTER TO UPCOMING DIARY
            */

            matter.upcomingDate = nextDate;

            matter.purpose =
                document.getElementById("nextPurpose")
                    .value || matter.purpose;

            matter.purposeKey =
                matter.purpose === "Hearing"
                    ? "hearing"
                    : matter.purpose === "Mention"
                    ? "mention"
                    : matter.purpose === "Judgment"
                    ? "judgment"
                    : matter.purpose === "Taxation"
                    ? "taxation"
                    : matter.purpose === "Ruling"
                    ? "ruling"
                    : "application";

            matter.handler =
                document.getElementById("nextHandler")
                    .value.trim();

            matter.courtNumber =
                document.getElementById("nextCourtNumber")
                    .value.trim() ||
                matter.courtNumber;

            matter.status = "active";

        } else {

            /*
              No next date = keep the matter in
              the system but it will have no
              upcoming date.
            */

            matter.status = "active";
        }

        saveData();

        document.getElementById("outcomeModal")
            .classList.remove("show");

        renderCase();
    });

/* ============================================================
   CALENDAR
============================================================ */

function renderCalendar() {

    const year =
        calendarDate.getFullYear();

    const month =
        calendarDate.getMonth();

    document.getElementById("monthTitle")
        .textContent =
            calendarDate.toLocaleDateString(
                "en-GB",
                {
                    month: "long",
                    year: "numeric"
                }
            );

    const grid =
        document.getElementById("calendarGrid");

    grid.innerHTML = "";

    [
        "Monday",
        "Tuesday",
        "Wednesday",
        "Thursday",
        "Friday",
        "Saturday",
        "Sunday"
    ].forEach(day => {

        const el =
            document.createElement("div");

        el.className = "weekday";
        el.textContent = day.substring(0,3);

        grid.appendChild(el);
    });

    const first =
        new Date(year, month, 1);

    let startDay =
        first.getDay();

    /*
      Convert Sunday=0 to Monday=0
    */

    startDay =
        startDay === 0 ? 6 : startDay - 1;

    for (let i = 0; i < startDay; i++) {

        const empty =
            document.createElement("div");

        empty.className = "day";

        grid.appendChild(empty);
    }

    const daysInMonth =
        new Date(year, month + 1, 0)
            .getDate();

    for (let day = 1; day <= daysInMonth; day++) {

        const el =
            document.createElement("div");

        el.className = "day";

        const date =
            `${year}-${String(month+1).padStart(2,"0")}-${String(day).padStart(2,"0")}`;

        if (date === todayISO()) {
            el.classList.add("today-day");
        }

        el.innerHTML =
            `<div class="day-number">${day}</div>`;

        let dayMatters =
            matters.filter(m =>
                m.status !== "closed" &&
                m.upcomingDate === date &&
                (
                    selectedStation === "ALL" ||
                    m.station === selectedStation
                )
            );

        /*
          Group calendar information by station/court/purpose
        */

        const groups = {};

        dayMatters.forEach(m => {

            const key =
                `${m.station}|${m.courtType}|${m.courtNumber}|${m.purpose}`;

            groups[key] =
                (groups[key] || 0) + 1;
        });

        Object.entries(groups)
            .slice(0, 3)
            .forEach(([key,count]) => {

                const [
                    station,
                    court,
                    courtNumber,
                    purpose
                ] = key.split("|");

                const event =
                    document.createElement("div");

                event.className = "event";

                event.textContent =
                    `${station} · ${purpose} (${count})`;

                el.appendChild(event);
            });

        if (dayMatters.length > 3) {

            const more =
                document.createElement("div");

            more.className = "event";

            more.textContent =
                `+ ${dayMatters.length - 3} more`;

            el.appendChild(more);
        }

        el.onclick = () => {
            selectedCalendarDate = date;
            renderDayResults(dayMatters, date);
        };

        grid.appendChild(el);
    }

    if (selectedCalendarDate) {

        const selected =
            matters.filter(m =>
                m.status !== "closed" &&
                m.upcomingDate === selectedCalendarDate &&
                (
                    selectedStation === "ALL" ||
                    m.station === selectedStation
                )
            );

        renderDayResults(
            selected,
            selectedCalendarDate
        );
    }
}

function renderDayResults(dayMatters, date) {

    const container =
        document.getElementById("dayResults");

    container.innerHTML = "";

    if (!dayMatters.length) {

        container.innerHTML =
            `<div class="empty">
                No active matters on
                ${formatDate(date)}.
             </div>`;

        return;
    }

    const groups = {};

    dayMatters.forEach(m => {

        const key =
            `${m.station}|${m.courtType}|${m.courtNumber}|${m.purpose}`;

        if (!groups[key]) {
            groups[key] = [];
        }

        groups[key].push(m);
    });

    const title =
        document.createElement("h3");

    title.textContent =
        `Matters for ${formatDate(date)}`;

    container.appendChild(title);

    Object.entries(groups)
        .forEach(([key, group]) => {

            const [
                station,
                court,
                courtNumber,
                purpose
            ] = key.split("|");

            const box =
                document.createElement("div");

            box.className = "group";

            box.innerHTML = `

                <div class="group-title">
                    ${escapeHTML(station)}
                    ${escapeHTML(court)}
                    — Before
                    ${escapeHTML(courtNumber || "Court not specified")}
                </div>

                <div class="group-subtitle">
                    ${group.length}
                    ${escapeHTML(purpose)}
                    ${group.length === 1 ? "" : "s"}
                </div>

            `;

            group.forEach(m => {

                const item =
                    document.createElement("div");

                item.style =
                    "margin-top:12px;padding-top:10px;border-top:1px solid #edf1f5";

                item.innerHTML = `

                    <strong>
                        ${escapeHTML(m.caseNumber)}
                    </strong>

                    —
                    <strong>
                        ${escapeHTML(m.client)}
                    </strong>

                    <br>

                    <span class="small-info">
                        To Be Done By:
                        ${escapeHTML(m.handler || "Not assigned")}
                    </span>

                `;

                item.onclick = () =>
                    openMatter(m.id);

                item.style.cursor = "pointer";

                box.appendChild(item);
            });

            container.appendChild(box);
        });
}

/* ============================================================
   SECURITY AGAINST HTML INJECTION
============================================================ */

function escapeHTML(value) {

    if (value === null ||
        value === undefined) return "";

    return String(value)
        .replaceAll("&", "&amp;")
